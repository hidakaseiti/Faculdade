<!DOCTYPE html>
<html>
    <head>
        <title>Aula 8(servidor)</title>
        <meta charset="utf-8">

    </head>
    <body>
        <h1>Servidor</h1>
        <p>Fabio Seiti</p>

        <h2>Exemplos de get/post</h2>
        <form action="/cadastrar"> <!-- só mudar o método de get para post ou vice versa,foi substituido la embaixo nos dois inputs,normalmente um form é construido com somente um metodo,mas da para usar os dois -->
            <p>Nome: <input type="text" name="nome"> </p> <!-- o name é o que identifica no servidor -->
            <p>Login: <input type="text" name="login"> </p>
            <p>Senha: <input type="password" name="senha"> </p>
            <input type="submit" value="Enviar com Get" formmethod="get">
            <input type="submit" value="Enviar com Post" formmethod="post">
        
        </form>

        <h2>Exemplo de FOR no EJS</h2> 
        <form action="/for" method="get">
            <p>qtde de DIVS <input type="number" name="qtde"></p>
            <input type="submit">
        </form>

    </body>
</html>
